name: 오늘의 환전 (매일)

on:
  schedule:
    # 평일 09:15 KST. GitHub 예약 실행은 가끔 늦거나 빠지기도 해서 09:45, 10:30에 한 번씩 더 돈다.
    # 이미 게시한 날은 바로 건너뛰니까 중복 게시는 없다.
    - cron: "15 0 * * 1-5"
    - cron: "45 0 * * 1-5"
    - cron: "30 1 * * 1-5"
  push:
    branches: [main]
    paths: ["trigger/**"]   # 외부 예약(트리거 파일 커밋)으로 바로 실행
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk ffmpeg >/dev/null
      - name: 환율 수집 + 카드 생성
        id: build
        env:
          HANA_PBLD_DV_CD: ${{ vars.HANA_PBLD_DV_CD || '1' }}
        run: python -m bot.main build ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: 결과 저장 (기록 + 카드)
        if: always()
        run: |
          git config user.name "hwanjeon-bot"
          git config user.email "hwanjeon-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "오늘의 환전 $(TZ=Asia/Seoul date +%F)"
          git push
      - name: 인스타 게시
        if: steps.build.outputs.skip == 'false'
        env:
          POST_ENABLED: ${{ vars.POST_ENABLED }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
        run: |
          python -m bot.main publish --date ${{ steps.build.outputs.day }}
          git add docs
          git diff --cached --quiet || (git commit -m "게시 완료 기록" && git push)
