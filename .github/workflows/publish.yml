name: 지금 게시 (수동)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "게시할 날짜 (YYYY-MM-DD, 비우면 가장 최근 카드)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 인스타 게시
        env:
          POST_ENABLED: "true"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST || 'graph.facebook.com' }}
        run: python -m bot.main publish ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "hwanjeon-bot"
          git config user.email "hwanjeon-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "게시 완료 기록" && git push)
